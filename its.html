<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <img src="WhatsApp Image 2026-11-07 at 14.04.37.jpeg" alt="Profile picture" width="150" height="150">
  <h1>Krypto</h1>
  <p class="info">Age: 20</p>
  <p class="info">Location: South Africa</p>
  <p class="info">Occupation: Student</p>
  <p class="info">Status: Tired</p>

  <div class="buttons">
    <a class="button primary" href="#">Add to story</a>
    <a class="button secondary" href="#">Edit profile</a>
  </div>
  <style>
    body {
      background-color: #000;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    img {
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    h1 {
      color: aliceblue;
      margin-bottom: 10px;
    }

    .info {
      color: white;
      margin: 5px 0;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .button {
      width: 100px;
      padding: 5px 10px;
      color: white;
      text-decoration: none;
      border-radius: 2px;
    }

    .primary {
      background-color: blue;
    }

    .secondary {
      background-color: grey;
    }
  </style>
</body>

</html>
